<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dark Titanium Metal Gradients -->
    <linearGradient id="medallionRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#475569" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="dragonChrome" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <linearGradient id="axiomCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="darkPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <filter id="metalRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- ── 1. Circular Outer Medallion Shield ── -->
  <circle cx="50" cy="50" r="47" fill="url(#darkPlate)" stroke="url(#medallionRim)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 2" />
  <circle cx="50" cy="50" r="39" stroke="url(#medallionRim)" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- ── 2. Intricate Coiled Dragon Silhouettes (Targaryen style) ── -->
  <g filter="url(#metalRelief)" fill="url(#dragonChrome)" stroke="url(#medallionRim)" stroke-width="0.6" stroke-linejoin="round">
    
    <!-- Top Primary Dragon Head & Arching Neck -->
    <path d="M50 14 C46 14, 42 16, 40 19 C38 22, 39 25, 43 26 C46 27, 49 25, 52 24 C56 22, 60 21, 64 24 C68 27, 69 32, 67 36 C64 41, 58 43, 53 43 C49 43, 44 41, 41 37 C39 34, 40 31, 42 29 C39 30, 36 33, 35 37 C33 43, 37 50, 43 53 C49 55, 56 54, 62 50 C68 45, 72 37, 70 29 C68 20, 59 14, 50 14 Z" />
    
    <!-- Dragon Snout, Horns & Jaw -->
    <path d="M40 19 L34 16 L31 18 L34 20 L37 20 L33 23 L36 24 L41 22 Z" />
    <path d="M34 16 L29 11 L32 14 L30 8 L35 13 L37 10 L38 15 Z" />

    <!-- Left Wing (Layered Spines & Feathers) -->
    <path d="M35 37 C30 35, 23 37, 18 42 C14 46, 12 52, 13 58 C15 64, 20 69, 26 71 C22 66, 21 60, 23 54 C25 48, 29 44, 35 43 Z" />
    <path d="M18 42 C22 47, 24 53, 23 60 M14 50 C18 54, 21 59, 22 65 M13 58 C17 62, 21 66, 25 69" stroke="url(#medallionRim)" stroke-width="1" />

    <!-- Right Wing & Ribbed Flanks -->
    <path d="M67 36 C73 34, 80 37, 84 42 C88 47, 89 54, 87 60 C84 66, 79 70, 72 72 C77 67, 78 61, 76 54 C74 48, 70 43, 64 42 Z" />
    <path d="M84 42 C80 47, 78 53, 79 60 M88 50 C84 54, 81 59, 80 65 M87 58 C83 62, 79 66, 75 69" stroke="url(#medallionRim)" stroke-width="1" />

    <!-- Coiled Serpentine Tails & Talons -->
    <path d="M26 71 C32 75, 40 77, 48 76 C56 75, 64 71, 69 65 C74 59, 75 51, 72 44 C70 48, 66 54, 61 58 C55 62, 47 64, 40 62 C34 60, 29 55, 27 49 C25 57, 25 65, 26 71 Z" />
    <path d="M48 76 C42 80, 34 82, 27 80 C21 78, 17 73, 16 67 C15 74, 20 81, 27 84 C35 87, 45 86, 53 82 C61 78, 67 71, 70 63 C67 69, 61 74, 54 76 Z" />

    <!-- Sharp Claws -->
    <path d="M38 62 L35 66 L38 65 L37 68 L40 66 L41 69 L43 65 Z" />
    <path d="M61 58 L64 62 L62 61 L65 63 L63 61 L66 61 L62 58 Z" />
  </g>

  <!-- ── 3. Central Axiom Delta "A" Emblem (Forged Titanium Peak) ── -->
  <g filter="url(#metalRelief)">
    <!-- Main A-Frame Pyramid Triangle -->
    <path
      d="M50 25 L68 67 H58 L53.5 56 H46.5 L42 67 H32 L50 25 Z"
      fill="url(#axiomCore)"
      stroke="url(#medallionRim)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Inner Floating Delta Core -->
    <polygon
      points="50,38 56,51 44,51"
      fill="#030712"
      stroke="url(#medallionRim)"
      stroke-width="1.2"
    />

    <!-- Brilliant Polished Apex Diamond -->
    <polygon
      points="50,22 52.5,26 50,30 47.5,26"
      fill="#ffffff"
      stroke="#0f172a"
      stroke-width="0.6"
    />

    <!-- Inner Core Spark Gem -->
    <circle cx="50" cy="46" r="2" fill="#f8fafc" stroke="#334155" stroke-width="0.8" />
  </g>

  <!-- ── 4. Cardinal Compass Points on Rim ── -->
  <g stroke="url(#medallionRim)" stroke-width="1.8" stroke-linecap="round">
    <line x1="50" y1="2" x2="50" y2="7" />
    <line x1="50" y1="93" x2="50" y2="98" />
    <line x1="2" y1="50" x2="7" y2="50" />
    <line x1="93" y1="50" x2="98" y2="50" />
  </g>
</svg>
